# options.cfg
# Minty Install Options
# ============================================================================
# Components
# ============================================================================

SWITCH_TO_FASTLY_REPO=true
SETUP_TIMESHIFT_SNAPSHOTS=false # disabled by default
UPGRADE_ALL_APT=true            # recommended

INSTALL_APT_LIST_EASY=true
INSTALL_FLATPAK_LIST_EASY=true
PURGE_APT_LIST_EASY=true
POST_INSTALL_CLEANUP=true
DELETE_SCRIPT_AFTER_INSTALLING=true

INSTALL_EXTRA_FONTS=true
INSTALL_TTF_FONTS=true
INSTALL_VSCODE_WITH_MODS=true
INSTALL_ZOOM_WITH_MODS=true
INSTALL_TTR=true
INSTALL_KOLOURPAINT_WITH_MODS=true
INSTALL_FIREFOX_ESR_PURGE_STABLE_WITH_MODS=true
INSTALL_LIBREOFFICE_FLATPAK_PURGE_APT=true
INSTALL_THUNDERBIRD_FLATPAK_PURGE_APT=true
INSTALL_CHROMIUM_WITH_MODS=true
INSTALL_VIRTUALBOX_WITH_EXT_PACK=true
# INSTALL_BOTTLES_DOWNLOAD_WIZARD=true ## TODO

CONFIGURE_LOGIN_WINDOW=true
CHANGE_GNOME_SCREENSHOT_SAVE_LOCATION=true
SET_CINNAMON_GTK_THEME=true
SET_WALLPAPER_SLIDESHOW=true
ADD_WORKSPACE_SWITCHER_APPLET=true
SET_DATE_FORMAT=true
INSTALL_CINNAMENU_APPLET=true
CREATE_DESKTOP_FILES=true
SET_GROUPED_WINDOW_LIST_APPLET=true
ADD_KEYBOARD_SHORTCUTS=true
ADD_DIRECTORIES_COLORS_BOOKMARKS=true
ADD_TEMPLATES=true
ADD_NEMO_TWEAKS=true
ADD_XED_TWEAKS=true
SET_ACCOUNT_PICTURE=false           # disabled by default
SET_HIDDEN_FILES=true

# only one should be true
DISABLE_WINDOW_TILING=true          # default
MAXIMIZE_WINDOW_AT_TOP=false

# ============================================================================
# Package Lists
# ============================================================================
# Add '#' before package name to add a comment, removing it from the list.

APT_PACKAGES_EASY=(
    # font-manager
    # steam-installer
    htop
    neofetch ## note: switch to fastfetch in LM 23
    tuptime ## tracks system uptime
    cmatrix ## fun

    ## dev tools
    git
    clang
)

FLATPAK_PACKAGES_EASY=(
    com.github.tchx84.Flatseal
    com.tomjwatson.Emote
    org.kde.kclock
    com.belmoussaoui.Authenticator
    de.haeckerfelix.Shortwave
    com.rafaelmardojai.Blanket
    org.gnome.Aisleriot
    org.gnome.Chess
    org.localsend.localsend_app
    com.github.unrud.VideoDownloader
    com.spotify.Client
    com.discordapp.Discord
)

APT_PURGE_EASY=(
    cups-browsed
)

EXTRA_FONTS_PACKAGES=(
    fonts-comic-neue
    fonts-inter
    fonts-open-sans
    fonts-montserrat
    fonts-ebgaramond
    fonts-roboto
    fonts-firacode
    fonts-jetbrains-mono
)

EXTRA_FONTS_FILES=(
    # Marriweather
    https://raw.githubusercontent.com/google/fonts/refs/heads/main/ofl/merriweather/Merriweather%5Bopsz%2Cwdth%2Cwght%5D.ttf
    https://raw.githubusercontent.com/google/fonts/refs/heads/main/ofl/merriweather/Merriweather-Italic%5Bopsz%2Cwdth%2Cwght%5D.ttf
)

# Note: `ttf-mscorefonts-installer`
#     Andale Mono
#     Arial Black
#     Arial (Bold, Italic, Bold Italic)
#     Comic Sans MS (Bold)
#     Courier New (Bold, Italic, Bold Italic)
#     Georgia (Bold, Italic, Bold Italic)
#     Impact
#     Times New Roman (Bold, Italic, Bold Italic)
#     Trebuchet (Bold, Italic, Bold Italic)
#     Verdana (Bold, Italic, Bold Italic)
#     Webdings

# ============================================================================
# Configuration
# ============================================================================

GNOME_SCREENSHOT_SAVE_LOCATION=~/Documents/Screenshots
THEME_COLOR="Teal"
WALLPAPER_DIRECTORY_LOCATION=~/Pictures # directory name: 'Wallpapers'
PANEL_CLOCK_FORMAT="%l:%M %p%n%-m/%-d/%Y"  # TODO: use variables in `en_us_w10_date_format``
PANEL_CLOCK_FORMAT_TOOLTIP="%A, %B %e, %Y"
PINNED_APPS_LIST='[
    "firefox.desktop",
    "firefox-esr.desktop",
    "nemo.desktop",
    "org.gnome.Terminal.desktop",
    "thunderbird.desktop",
    "org.mozilla.thunderbird.desktop",
    "libreoffice-writer.desktop",
    "org.libreoffice.LibreOffice.writer.desktop",
    "code.desktop",
    "org.kde.kclock.desktop"
]'
FAVORITE_APPS_LIST=\
"['chromium-browser.desktop', 'mintinstall.desktop', \
'virtualbox.desktop', 'com.rafaelmardojai.Blanket.desktop:flatpak', \
'de.haeckerfelix.Shortwave.desktop:flatpak', 'org.x.editor.desktop', \
'org.gnome.Calculator.desktop', 'org.gnome.Calendar.desktop', \
'cinnamon-settings.desktop']"
